<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #mydiv{
            margin-top: 15px;
            width: 200px;
            height: 200px;
            background-color: blue;
            overflow: auto;
        }
        .content{
            height: 300px;
        }
    </style>
</head>
<body>
    <h2>Welacome to Event</h2>
    <input id="myEvent" placeholder="Type something to search here">
    <div id="mydiv">
        <div class="content">Scroll inside me</div>
    </div>
    <script>
        const input = document.getElementById("myEvent")
        const div = document.getElementById("mydiv")

       /* //1. keyup - when key is released you get output
         input.addEventListener('keyup',function(e){
            console.log('Key Released -'+ e.key)
         })*/

        /* //2.keydown - when key is pressed you get an output
         input.addEventListener('keydown',function(e){
            console.log('Key Pressed -'+ e.key)
         })*/

         //3.change - change happening in the input
         input.addEventListener('change',function(y){
            console.log('Value of input - ' + y.target.value)
         })

         //4.Mouseover - moving mouse over something
         div.addEventListener('mouseover',function(){
            div.style.backgroundColor = "red"
         })

         div.addEventListener('mouseout',function(){
            div.style.backgroundColor = "yellow"
         })
    </script>
</body>
</html>
